  <!-- Scripts Smooth Scroll & Drawer Control -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script>
    // 1. Smooth Scroll Setup (Lenis en instancia global para que carga.js lo use)
    window.lenis = new Lenis({ duration: 1.2, smoothWheel: true });
    function raf(time) {
      window.lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // 2. Mobile Drawer Logic
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('menu-close');
    const mobileMenu = document.getElementById('mobile-menu');
    const drawerContent = document.getElementById('drawer-content');

    function toggleDrawer() {
      const isOpen = !mobileMenu.classList.contains('opacity-0');
      if (isOpen) {
        window.cerrarMenuMovil();
      } else {
        mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
        drawerContent.classList.remove('-translate-x-full');
        document.body.classList.add('overflow-hidden'); // Bloquea el scroll de fondo
      }
    }

    // Función explícita para cerrar el menú (usada tras dar clic a un enlace)
    window.cerrarMenuMovil = function () {
      if (!mobileMenu || !drawerContent) return;
      drawerContent.classList.add('-translate-x-full');
      mobileMenu.classList.add('opacity-0', 'pointer-events-none');
      document.body.classList.remove('overflow-hidden');
    };

    menuBtn?.addEventListener('click', toggleDrawer);
    closeBtn?.addEventListener('click', toggleDrawer);
    mobileMenu?.addEventListener('click', (e) => {
      if (e.target === mobileMenu) toggleDrawer();
    });

    // 3. Control del botón Back To Top según scroll
    const backToTopBtn = document.getElementById('back-to-top');
    
    // Escuchamos el evento scroll de Lenis para mayor precisión
    window.lenis.on('scroll', (e) => {
      if (e.scroll > 300) {
        backToTopBtn?.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        backToTopBtn?.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    backToTopBtn?.addEventListener('click', () => {
      window.lenis.scrollTo(0);
    });
  </script>
