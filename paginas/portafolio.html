<!-- PORTAFOLIO -->
<section
  id="portafolio"
  class="fondo mb-24 rounded-2xl shadow-lg py-16 px-6 lg:px-12"
>
  <div class="max-w-6xl mx-auto space-y-8">
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-semibold text-gray-800">Galería de Trabajos</h2>
      <p class="text-gray-600 text-sm max-w-lg mx-auto">
        Explora nuestros looks y transformaciones. ¿Quieres ver más de nuestro trabajo diario? Visita nuestro Instagram.
      </p>
    </div>
    
    <!-- Barra de búsqueda y acceso a Instagram -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <div class="relative w-full sm:w-1/2">
        <span class="absolute top-2.5 left-0 pl-3.5 flex items-center pointer-events-none text-rose-900">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </span>
        <input
          type="text"
          id="portafolio-search"
          placeholder="Buscar look o estilo..."
          class="search-neumorph w-full border border-gray-300 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-rose-800"
        />
      </div>

      <a
        href="https://www.instagram.com/daniglow_beauty/"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 btn-neumorph text-rose-900 font-semibold px-5 py-2 rounded-full text-sm hover:text-rose-950 transition shrink-0"
      >
        <i class="fa-brands fa-instagram text-lg"></i>
        <span>Ver más en Instagram</span>
      </a>
    </div>

    <!-- Filtros por categoría -->
    <div class="flex flex-wrap justify-center gap-3" id="portafolio-filtros">
      <button data-cat="all" class="btn-neumorph bg-rose-100 text-rose-900 font-medium px-4 py-1.5 rounded-full text-sm transition">Todos</button>
      <button data-cat="social" class="btn-neumorph text-gray-600 px-4 py-1.5 rounded-full text-sm hover:bg-rose-50 transition">Social</button>
      <button data-cat="novia" class="btn-neumorph text-gray-600 px-4 py-1.5 rounded-full text-sm hover:bg-rose-50 transition">Novias / XV</button>
      <button data-cat="editorial" class="btn-neumorph text-gray-600 px-4 py-1.5 rounded-full text-sm hover:bg-rose-50 transition">Editorial</button>
    </div>

    <!-- Grid vacío: JS rellenará con tarjetas -->
    <div id="portafolio-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
  </div>
</section>

<!-- Template de tarjeta, invisible en el DOM -->
<template id="portafolio-card-template">
  <div class="group relative overflow-hidden rounded-3xl border border-slate-200 bg-[#e0e5ec] text-[#0f172a] shadow-neumo transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-slate-700 dark:bg-[#1e2430] dark:text-[#f8fafc] dark:shadow-neumo-dark">
    <!-- Imagen -->
    <img src="" alt="" class="h-64 w-full object-cover transition-transform duration-300 group-hover:scale-105" />

    <!-- Overlay al hover -->
    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
      <!-- Contenedor genérico para acción (Ver en IG o ampliar) -->
      <div data-role="action" class="flex items-center justify-center gap-4"></div>
    </div>

    <!-- Contenido -->
    <div class="flex min-h-[160px] flex-col justify-between bg-[#e0e5ec] p-6 dark:bg-[#1e2430]">
      <div>
        <h5 class="mb-2 text-xl font-bold text-[#0f172a] dark:text-[#f8fafc]" data-role="title">Título</h5>
        <p class="mb-4 text-sm font-medium text-[#334155] dark:text-[#cbd5e1]" data-role="desc">Descripción breve.</p>
      </div>
      <!-- Etiquetas / Detalles -->
      <div class="flex flex-wrap gap-2" data-role="tags"></div>
    </div>
  </div>
</template>
